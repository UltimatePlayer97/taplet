name: release-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Nix release build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: taplet-nix-${{ runner.os }}-release-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: taplet-nix-${{ runner.os }}-

      - name: Build release package
        run: nix build .#default --print-build-logs --out-link result

      - name: Package Nix output
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-snapshot}"
          tar -czf "dist/taplet-${version}-x86_64-linux.tar.gz" -C result .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: taplet-release-${{ github.run_number }}
          path: dist/*.tar.gz
          if-no-files-found: error
