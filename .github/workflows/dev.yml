name: dev-build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nix dev build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: taplet-nix-${{ runner.os }}-dev-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: taplet-nix-${{ runner.os }}-

      - name: Build development package
        run: nix build .#dev --print-build-logs
